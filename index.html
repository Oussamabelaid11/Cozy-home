<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cozy Home - Professional Marketplace & Dashboard</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
      <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
      <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
      <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F5F1E8; color: #2C2C2C; }
                .gradient-warm { background: linear-gradient(135deg, #C4A57B 0%, #D4B896 100%); }
                .gradient-dark { background: linear-gradient(135deg, #2C2C2C 0%, #1F1F1F 100%); }
                .card-hover { transition: all 0.3s ease; }
                .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
                .btn-primary { background: linear-gradient(135deg, #C4A57B 0%, #D4B896 100%); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
                .btn-primary:hover { transform: scale(1.02); }
                .btn-secondary { background: white; color: #2C2C2C; border: 2px solid #C4A57B; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
                .stat-card { background: white; border-left: 4px solid #C4A57B; padding: 20px; border-radius: 8px; }
                .menu-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; }
                .menu-item.active { background: #F5F1E8; border-left-color: #C4A57B; color: #C4A57B; font-weight: 600; }
                .nav-link { color: #2C2C2C; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.3s; }
                .nav-link:hover { background: #F5F1E8; }
            </style>
  </head>
  <body>
        <div id="root"></div>div>

        <script type="text/babel">
                  const { useState, useEffect } = React;

                  function App() {
                                const [currentPage, setCurrentPage] = useState('storefront');
                                const [cart, setCart] = useState([]);
                                const [loading, setLoading] = useState(true);
                                const [orders, setOrders] = useState([
                                  { id: 1001, customer: 'Ahmed B.', total: 149.9, date: '2026-04-15', status: 'Delivered' },
                                  { id: 1002, customer: 'Fatima K.', total: 89.5, date: '2026-04-14', status: 'Shipped' },
                                  { id: 1003, customer: 'Mohammed A.', total: 234.7, date: '2026-04-13', status: 'Processing' },
                                  { id: 1004, customer: 'Noor S.', total: 67.2, date: '2026-04-12', status: 'Delivered' },
                                              ]);
                                const [banners, setBanners] = useState([
                                  { id: 1, title: 'Spring Collection', discount: '30% OFF', image: '🌸', active: true },
                                  { id: 2, title: 'Ramadan Special', discount: 'Up to 50%', image: '🌙', active: true },
                                              ]);
                                const [products, setProducts] = useState([
                                  { id: 1, name: 'Luxury Bath Set', price: 49.9, image: '🛁', category: 'Bath', rating: 4.8, sales: 234 },
                                  { id: 2, name: 'Silk Pillowcase', price: 29.5, image: '🛏️', category: 'Bedding', rating: 4.9, sales: 512 },
                                  { id: 3, name: 'Aromatherapy Diffuser', price: 34.9, image: '💨', category: 'Home', rating: 4.7, sales: 189 },
                                  { id: 4, name: 'Egyptian Cotton Sheets', price: 59.9, image: '🧵', category: 'Bedding', rating: 4.9, sales: 456 },
                                  { id: 5, name: 'Scented Candles Set', price: 24.9, image: '🕯️', category: 'Decor', rating: 4.6, sales: 378 },
                                  { id: 6, name: 'Premium Towels', price: 39.9, image: '🌊', category: 'Bath', rating: 4.8, sales: 267 },
                                              ]);

                                useEffect(() => {
                                                  const fetchProducts = async () => {
                                                                        try {
                                                                                                  const response = await fetch('https://raw.githubusercontent.com/Oussamabelaid11/Cozy-home/main/products.json');
                                                                                                  if (response.ok) {
                                                                                                                                const data = await response.json();
                                                                                                                                if (Array.isArray(data)) {
                                                                                                                                                                  setProducts(data);
                                                                                                                                  }
                                                                                                    }
                                                                        } catch (error) {
                                                                                                  console.log('Using default products');
                                                                        } finally {
                                                                                                  setLoading(false);
                                                                        }
                                                  };
                                                  fetchProducts();
                                }, []);

                                const totalRevenue = orders.reduce((sum, order) => sum + order.total, 0);
                                const totalOrders = orders.length;
                                const totalProducts = products.length;
                                const avgRating = products.length > 0 ? (products.reduce((sum, p) => sum + (p.rating || 4.5), 0) / products.length).toFixed(1) : 0;

                                return (
                                                  <div className="flex h-screen bg-gray-100">
                                                                        <div className="w-64 gradient-dark text-white shadow-lg overflow-y-auto">
                                                                                                  <div className="p-6 text-center border-b border-gray-700">
                                                                                                                                <svg width="120" height="60" viewBox="0 0 120 60" className="mx-auto mb-3">
                                                                                                                                                                  <defs>
                                                                                                                                                                                                        <pattern id="wood" patternUnits="userSpaceOnUse" width="4" height="4">
                                                                                                                                                                                                                                                  <rect width="4" height="4" fill="#C4A57B"/>
                                                                                                                                                                                                                                                  <line x1="0" y1="0" x2="4" y2="4" stroke="#A68B5B" strokeWidth="0.5" opacity="0.5"/>
                                                                                                                                                                                                                                              </pattern>
                                                                                                                                                                    </defs>
                                                                                                                                                                  <text x="20" y="30" fontSize="20" fontWeight="bold" fill="url(#wood)" fontFamily="Georgia, serif">COZY</text>
                                                                                                                                                                  <text x="20" y="50" fontSize="16" fontWeight="bold" fill="#1F1F1F" fontFamily="Georgia, serif" letterSpacing="2">HOME</text>
                                                                                                                                  </svg>
                                                                                                                                <h1 className="text-sm font-bold text-gray-300 mt-2">Professional Marketplace</h1>
                                                                                                    </div>

                                                                                                  <nav className="p-4 space-y-2">
                                                                                                    {[
                                                    { id: 'storefront', label: '🛍️ Storefront', icon: '🛒' },
                                                    { id: 'dashboard', label: '📊 Analytics', icon: '📈' },
                                                    { id: 'products', label: '📦 Products', icon: '📦' },
                                                    { id: 'banners', label: '🎨 Promotions', icon: '🎯' },
                                                    { id: 'orders', label: '📋 Orders', icon: '✓' },
                                                                                ].map(item => (
                                                                                                                  <div
                                                                                                                                                        key={item.id}
                                                                                                                                                        onClick={() => setCurrentPage(item.id)}
                                                                                                                                                        className={`menu-item rounded-lg ${currentPage === item.id ? 'active bg-white text-gray-800' : 'text-gray-300 hover:text-white'}`}
                                                                                                                                                    >
                                                                                                                                                        <span className="mr-2">{item.icon}</span>
                                                                                                                    {item.label}
                                                                                                                    </div>
                                                                                                              ))}
                                                                                                    </nav>
                                                                        </div>

                                                                        <div className="flex-1 overflow-auto">
                                                                                                  <div className="bg-white shadow-sm sticky top-0 z-10">
                                                                                                                                <div className="px-8 py-6 flex justify-between items-center">
                                                                                                                                                                  <h2 className="text-2xl font-bold text-gray-800">
                                                                                                                                                                                                        {currentPage === 'storefront' && '🛍️ Cozy Home Storefront'}
                                                                                                                                                                                                        {currentPage === 'dashboard' && '📊 Analytics Dashboard'}
                                                                                                                                                                                                        {currentPage === 'products' && '📦 Product Management'}
                                                                                                                                                                                                        {currentPage === 'banners' && '🎨 Promotion Manager'}
                                                                                                                                                                                                        {currentPage === 'orders' && '📋 Order Management'}
                                                                                                                                                                    </h2>
                                                                                                                                  {currentPage === 'storefront' && (
                                                                                        <div className="bg-gradient-warm text-white px-6 py-2 rounded-lg font-semibold">
                                                                                                                                  🛒 Cart: {cart.length} items
                                                                                          </div>
                                                                                    )}
                                                                                                                                  </div>
                                                                                                    </div>

                                                                                                  <div className="p-8">
                                                                                                    {currentPage === 'storefront' && <Storefront products={products} banners={banners} cart={cart} setCart={setCart} />}
                                                                                                    {currentPage === 'dashboard' && <Dashboard orders={orders} products={products} totalRevenue={totalRevenue} totalOrders={totalOrders} avgRating={avgRating} />}
                                                                                                    {currentPage === 'products' && <ProductManager products={products} setProducts={setProducts} />}
                                                                                                    {currentPage === 'banners' && <BannerManager banners={banners} setBanners={setBanners} />}
                                                                                                    {currentPage === 'orders' && <OrderManager orders={orders} />}
                                                                                                    </div>
                                                                        </div>
                                                  </div>
                                              );
                  }

                  function Storefront({ products, banners, cart, setCart }) {
                                return (
                                                  <div className="space-y-8">
                                                                        <div className="relative h-64 rounded-xl overflow-hidden shadow-lg">
                                                                                                  <div className="gradient-warm h-full flex items-center justify-center text-white text-center p-8">
                                                                                                                                <div>
                                                                                                                                                                  <h3 className="text-4xl font-bold mb-4">{banners[0]?.title}</h3>
                                                                                                                                                                  <p className="text-2xl font-semibold">{banners[0]?.discount}</p>
                                                                                                                                  </div>
                                                                                                    </div>
                                                                        </div>

                                                                        <div>
                                                                                                  <h3 className="text-2xl font-bold mb-6 text-gray-800">Featured Products</h3>
                                                                                                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                                                                    {products.length > 0 ? products.map(product => (
                                                                                    <div key={product.id} className="bg-white rounded-lg overflow-hidden shadow-md card-hover">
                                                                                                                          <div className="bg-gradient-to-br from-amber-100 to-amber-50 h-40 flex items-center justify-center text-6xl">
                                                                                                                            {product.image && product.image.startsWith('http') ? (
                                                                                                                                  <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                                                                                                              ) : (
                                                                                                                                  <span>{product.image || '📦'}</span>
                                                                                                                              )}
                                                                                                                            </div>
                                                                                                                          <div className="p-6">
                                                                                                                                                                    <h4 className="font-bold text-lg mb-2 line-clamp-2">{product.name}</h4>
                                                                                                                                                                    <p className="text-sm text-gray-600 mb-3">Category: {product.category || 'Home'}</p>
                                                                                                                                                                    <div className="flex justify-between items-center mb-4">
                                                                                                                                                                                                                  <span className="text-2xl font-bold gradient-warm bg-clip-text text-transparent">${typeof product.price === 'number' ? product.price.toFixed(2) : product.price}</span>
                                                                                                                                                                                                                  <span className="text-yellow-500 text-sm">⭐ {(product.rating || 4.5).toFixed(1)}</span>
                                                                                                                                                                                                              </div>
                                                                                                                                                                    <p className="text-xs text-gray-500 mb-4">{product.sales || 0} sold</p>
                                                                                                                                                                    <button onClick={() => setCart([...cart, product])} className="btn-primary w-full text-center">Add to Cart</button>
                                                                                                                            </div>
                                                                                      </div>
                                                                                )) : <div className="col-span-3 text-center py-8 text-gray-500"><p>Loading products...</p></div>}
                                                                                                    </div>
                                                                        </div>
                                                  </div>
                                              );
                  }

                  function Dashboard({ orders, products, totalRevenue, totalOrders, avgRating }) {
                                return (
                                                  <div className="space-y-8">
                                                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                                                                                  <div className="stat-card">
                                                                                                                                <p className="text-gray-600 text-sm font-semibold">Total Revenue</p>
                                                                                                                                <p className="text-3xl font-bold mt-2">${totalRevenue.toFixed(2)}</p>
                                                                                                                                <p className="text-xs text-green-600 mt-2">+12.5% from last month</p>
                                                                                                    </div>
                                                                                                  <div className="stat-card">
                                                                                                                                <p className="text-gray-600 text-sm font-semibold">Total Orders</p>
                                                                                                                                <p className="text-3xl font-bold mt-2">{totalOrders}</p>
                                                                                                                                <p className="text-xs text-green-600 mt-2">+8 from last week</p>
                                                                                                    </div>
                                                                                                  <div className="stat-card">
                                                                                                                                <p className="text-gray-600 text-sm font-semibold">Products</p>
                                                                                                                                <p className="text-3xl font-bold mt-2">{products.length}</p>
                                                                                                                                <p className="text-xs text-blue-600 mt-2">All active</p>
                                                                                                    </div>
                                                                                                  <div className="stat-card">
                                                                                                                                <p className="text-gray-600 text-sm font-semibold">Avg Rating</p>
                                                                                                                                <p className="text-3xl font-bold mt-2">{avgRating}⭐</p>
                                                                                                                                <p className="text-xs text-blue-600 mt-2">Customer satisfaction</p>
                                                                                                    </div>
                                                                        </div>

                                                                        <div className="bg-white rounded-lg shadow-md p-6">
                                                                                                  <h3 className="text-xl font-bold mb-4">Recent Orders</h3>
                                                                                                  <div className="overflow-x-auto">
                                                                                                                                <table className="w-full">
                                                                                                                                                                  <thead className="border-b-2 border-gray-200">
                                                                                                                                                                                                        <tr className="text-left text-sm font-semibold text-gray-600">
                                                                                                                                                                                                                                                  <th className="pb-3">Order ID</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Customer</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Date</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Amount</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Status</th>
                                                                                                                                                                                                                                              </tr>
                                                                                                                                                                    </thead>
                                                                                                                                                                  <tbody>
                                                                                                                                                                                                        {orders.map(order => (
                                                                                            <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                                                                                                          <td className="py-4 font-semibold text-gray-800">#{order.id}</td>
                                                                                                                                          <td className="py-4 text-gray-700">{order.customer}</td>
                                                                                                                                          <td className="py-4 text-gray-700">{order.date}</td>
                                                                                                                                          <td className="py-4 font-bold text-gray-800">${order.total}</td>
                                                                                                                                          <td className="py-4"><span className={`px-3 py-1 rounded-full text-xs font-semibold ${order.status === 'Delivered' ? 'bg-green-100 text-green-700' : order.status === 'Shipped' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}`}>{order.status}</span></td>
                                                                                              </tr>
                                                                                        ))}
                                                                                                                                                                    </tbody>
                                                                                                                                  </table>
                                                                                                    </div>
                                                                        </div>
                                                  </div>
                                              );
                  }

                  function ProductManager({ products, setProducts }) {
                                const [newProduct, setNewProduct] = useState({ name: '', price: '', category: '', image: '' });
                                const addProduct = () => {
                                                  if (newProduct.name && newProduct.price && newProduct.category) {
                                                                        setProducts([...products, { id: products.length + 1, ...newProduct, price: parseFloat(newProduct.price), rating: 4.5, sales: 0 }]);
                                                                        setNewProduct({ name: '', price: '', category: '', image: '' });
                                                  }
                                };
                                return (
                                                  <div className="space-y-6">
                                                                        <div className="bg-white rounded-lg shadow-md p-6">
                                                                                                  <h3 className="text-xl font-bold mb-4">Add New Product</h3>
                                                                                                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                                                                                                                <input type="text" placeholder="Product Name" value={newProduct.name} onChange={(e) => setNewProduct({...newProduct, name: e.target.value})} className="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" />
                                                                                                                                <input type="number" placeholder="Price" value={newProduct.price} onChange={(e) => setNewProduct({...newProduct, price: e.target.value})} className="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" />
                                                                                                                                <input type="text" placeholder="Category" value={newProduct.category} onChange={(e) => setNewProduct({...newProduct, category: e.target.value})} className="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" />
                                                                                                                                <button onClick={addProduct} className="btn-primary">Add Product</button>
                                                                                                    </div>
                                                                        </div>

                                                                        <div className="bg-white rounded-lg shadow-md p-6">
                                                                                                  <h3 className="text-xl font-bold mb-4">Inventory</h3>
                                                                                                  <div className="overflow-x-auto">
                                                                                                                                <table className="w-full">
                                                                                                                                                                  <thead className="border-b-2 border-gray-200">
                                                                                                                                                                                                        <tr className="text-left text-sm font-semibold text-gray-600">
                                                                                                                                                                                                                                                  <th className="pb-3">Product</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Category</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Price</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Sales</th>
                                                                                                                                                                                                                                                  <th className="pb-3">Rating</th>
                                                                                                                                                                                                                                              </tr>
                                                                                                                                                                    </thead>
                                                                                                                                                                  <tbody>
                                                                                                                                                                                                        {products.map(product => (
                                                                                            <tr key={product.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                                                                                                          <td className="py-4 font-semibold text-gray-800">{product.image} {product.name}</td>
                                                                                                                                          <td className="py-4 text-gray-700">{product.category}</td>
                                                                                                                                          <td className="py-4 font-bold text-gray-800">${product.price}</td>
                                                                                                                                          <td className="py-4 text-gray-700">{product.sales} units</td>
                                                                                                                                          <td className="py-4 text-yellow-500">⭐ {product.rating}</td>
                                                                                              </tr>
                                                                                        ))}
                                                                                                                                                                    </tbody>
                                                                                                                                  </table>
                                                                                                    </div>
                                                                        </div>
                                                  </div>
                                              );
                  }

                  function BannerManager({ banners, setBanners }) {
                                const [newBanner, setNewBanner] = useState({ title: '', discount: '', image: '' });
                                const addBanner = () => {
                                                  if (newBanner.title && newBanner.discount) {
                                                                        setBanners([...banners, { id: banners.length + 1, ...newBanner, active: true }]);
                                                                        setNewBanner({ title: '', discount: '', image: '' });
                                                  }
                                };
                                return (
                                                  <div className="space-y-6">
                                                                        <div className="bg-white rounded-lg shadow-md p-6">
                                                                                                  <h3 className="text-xl font-bold mb-4">Create Promotion Banner</h3>
                                                                                                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                                                                                                <input type="text" placeholder="Banner Title" value={newBanner.title} onChange={(e) => setNewBanner({...newBanner, title: e.target.value})} className="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" />
                                                                                                                                <input type="text" placeholder="Discount/Offer" value={newBanner.discount} onChange={(e) => setNewBanner({...newBanner, discount: e.target.value})} className="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" />
                                                                                                                                <button onClick={addBanner} className="btn-primary">Create Banner</button>
                                                                                                    </div>
                                                                        </div>

                                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                                          {banners.map(banner => (
                                                                                <div key={banner.
  </body>
      </style></title>
  </head>id} className="gradient-warm rounded-lg overflow-hidden shadow-lg text-white p-8 card-hover">
                                                                                                          <div className="text-5xl mb-4">{banner.image || '🎯'}</div>
                                                                                                          <h3 className="text-2xl font-bold mb-2">{banner.title}</h3>
                                                                                                          <p className="text-xl font-semibold mb-4">{banner.discount}</p>
                                                                                                          <span className="inline-block bg-white text-amber-600 px-3 py-1 rounded-full text-xs font-bold">{banner.active ? '✓ Active' : 'Inactive'}</span>
                                                                          </div>
                                                                            ))}
                                                  </div>
                                  </div>
                                              );
                  }

                  function OrderManager({ orders }) {
                                return (
                                                  <div className="bg-white rounded-lg shadow-md p-6">
                                                                        <h3 className="text-xl font-bold mb-4">All Orders</h3>
                                                                        <div className="overflow-x-auto">
                                                                                                  <table className="w-full">
                                                                                                                                <thead className="border-b-2 border-gray-200">
                                                                                                                                                                  <tr className="text-left text-sm font-semibold text-gray-600">
                                                                                                                                                                                                        <th className="pb-3">Order ID</th>
                                                                                                                                                                                                        <th className="pb-3">Customer</th>
                                                                                                                                                                                                        <th className="pb-3">Date</th>
                                                                                                                                                                                                        <th className="pb-3">Amount</th>
                                                                                                                                                                                                        <th className="pb-3">Status</th>
                                                                                                                                                                                                        <th className="pb-3">Action</th>
                                                                                                                                                                    </tr>
                                                                                                                                  </thead>
                                                                                                                                <tbody>
                                                                                                                                  {orders.map(order => (
                                                                                        <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                                                                                                  <td className="py-4 font-semibold text-gray-800">#{order.id}</td>
                                                                                                                                  <td className="py-4 text-gray-700">{order.customer}</td>
                                                                                                                                  <td className="py-4 text-gray-700">{order.date}</td>
                                                                                                                                  <td className="py-4 font-bold text-gray-800">${order.total}</td>
                                                                                                                                  <td className="py-4"><span className={`px-3 py-1 rounded-full text-xs font-semibold ${order.status === 'Delivered' ? 'bg-green-100 text-green-700' : order.status === 'Shipped' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}`}>{order.status}</span></td>
                                                                                                                                  <td className="py-4"><button className="text-amber-600 font-semibold hover:text-amber-800">View</button></td>
                                                                                          </tr>
                                                                                    ))}
                                                                                                                                  </tbody>
                                                                                                    </table>
                                                                        </div>
                                                  </div>
                                              );
                  }

                  const root = ReactDOM.createRoot(document.getElementById('root'));
                  root.render(<App />);
</script>
  </body>body>
</html>html>
</html>
